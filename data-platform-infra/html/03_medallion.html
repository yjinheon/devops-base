<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iceberg Medallion 배치 파이프라인</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <!--
  title: "Iceberg Medallion 배치 파이프라인"
  tiers:
    - { name: Sources,            bucket: "OLTP · SaaS · Kafka",  style: outer }
    - { name: Bronze,             bucket: "iceberg.*_bronze",     style: default }
    - { name: Silver,             bucket: "iceberg.silver",       style: default }
    - { name: Gold,               bucket: "iceberg.gold",         style: default }
    - { name: ClickHouse serving, bucket: "clickhouse gold.*",    focal: true }
  example_label: "EXAMPLES"
  promotions: [A · INGEST, B · CLEAN, B · MODEL, C · PUBLISH(focal)]
  paths: [SUBSTRATE, MAINTENANCE]
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #5a6580; --rule: rgba(45,49,66,0.12); --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08); --link: #2e5aa8;
      --sans: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1040px; }
    .tier-title { fill: var(--ink); font: 600 13px var(--sans); text-anchor: middle; }
    .bucket, .field-value, .example-value { fill: var(--muted); font: 400 9px var(--mono); }
    .bucket { text-anchor: middle; }
    .field-value { color: var(--muted); }
    .focal-text { fill: var(--accent); }
    .field-label { fill: var(--ink); font: 600 11px var(--sans); }
    .example-label, .arc-label, .path-tag { font-family: var(--mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .example-label { fill: var(--soft); font-size: 8px; }
    .arc-label { font-size: 10px; text-anchor: middle; }
    .path-title { fill: var(--ink); font: 600 11px var(--sans); }
    .path-sub { fill: var(--muted); font: 400 9px var(--mono); }
    .callout { margin-top: 1rem; color: var(--ink); font: italic 400 1rem/1.4 var(--serif); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Medallion · k3s data platform · 03</p>
    <h1>Iceberg Medallion 배치 파이프라인</h1>

    <div class="scroll">
    <svg viewBox="0 0 1040 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="medallion-title medallion-desc">
      <title id="medallion-title">Iceberg medallion batch pipeline</title>
      <desc id="medallion-desc">소스 데이터가 Airflow 수집으로 Iceberg bronze에 쌓이고 dbt-trino로 silver·gold가 만들어진 뒤 ClickHouse gold로 atomic swap 게시된다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <clipPath id="clip-src"><rect x="16" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-bronze"><rect x="204" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-silver"><rect x="392" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-gold"><rect x="580" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-serve"><rect x="768" y="80" width="172" height="380" rx="6"/></clipPath>
      </defs>
      <rect width="1040" height="548" fill="#f5f5f5"/>

      <!-- Promotion arcs (drawn before tiers) -->
      <path d="M102 80 C102 0 290 0 290 80" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M290 80 C290 0 478 0 478 80" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M478 80 C478 0 666 0 666 80" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M666 80 C666 0 854 0 854 80" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="196" y="50" class="arc-label" fill="#4f5d75">A · INGEST</text>
      <text x="384" y="50" class="arc-label" fill="#4f5d75">B · CLEAN</text>
      <text x="572" y="50" class="arc-label" fill="#4f5d75">B · MODEL</text>
      <text x="760" y="50" class="arc-label" fill="#bf4520">C · PUBLISH</text>

      <!-- Sources (outer) -->
      <rect x="16" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="16" y="80" width="172" height="50" fill="rgba(79,93,117,0.10)" clip-path="url(#clip-src)"/>
      <rect x="16" y="80" width="172" height="380" rx="6" fill="none" stroke="#4f5d75"/>
      <text x="102" y="106" class="tier-title">Sources</text>
      <text x="102" y="144" class="bucket">OLTP · SaaS · Kafka</text>
      <text x="32" y="180" class="field-label">Tool</text>
      <foreignObject x="32" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Airflow 3.2 ingest task</div></foreignObject>
      <text x="32" y="220" class="field-label">Format</text>
      <foreignObject x="32" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">JDBC · REST API · Kafka</div></foreignObject>
      <text x="32" y="260" class="field-label">Writer</text>
      <foreignObject x="32" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Oracle · MariaDB · MySQL · PG</div></foreignObject>
      <text x="32" y="360" class="example-label">EXAMPLES</text>
      <text x="32" y="374" class="example-value">Cafe24 · Makeshop · GA4</text>
      <text x="32" y="388" class="example-value">Kafka IMC request_log</text>

      <!-- Bronze -->
      <rect x="204" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="204" y="80" width="172" height="50" fill="rgba(45,49,66,0.06)" clip-path="url(#clip-bronze)"/>
      <rect x="204" y="80" width="172" height="380" rx="6" fill="none" stroke="#2d3142"/>
      <text x="290" y="106" class="tier-title">Bronze</text>
      <text x="290" y="144" class="bucket">iceberg.*_bronze</text>
      <text x="220" y="180" class="field-label">Tool</text>
      <foreignObject x="220" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">pyiceberg · polars · Spark-on-YARN</div></foreignObject>
      <text x="220" y="220" class="field-label">Format</text>
      <foreignObject x="220" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Iceberg · raw append</div></foreignObject>
      <text x="220" y="260" class="field-label">Writer</text>
      <foreignObject x="220" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">ingest DAG → emits Asset</div></foreignObject>
      <text x="220" y="360" class="example-label">EXAMPLES</text>
      <text x="220" y="374" class="example-value">bronze · tma_bronze</text>
      <text x="220" y="388" class="example-value">tason_bronze</text>

      <!-- Silver -->
      <rect x="392" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="392" y="80" width="172" height="50" fill="rgba(45,49,66,0.06)" clip-path="url(#clip-silver)"/>
      <rect x="392" y="80" width="172" height="380" rx="6" fill="none" stroke="#2d3142"/>
      <text x="478" y="106" class="tier-title">Silver</text>
      <text x="478" y="144" class="bucket">iceberg.silver</text>
      <text x="408" y="180" class="field-label">Tool</text>
      <foreignObject x="408" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">dbt-trino · Asset trigger</div></foreignObject>
      <text x="408" y="220" class="field-label">Format</text>
      <foreignObject x="408" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Iceberg · cleaned · conformed</div></foreignObject>
      <text x="408" y="260" class="field-label">Writer</text>
      <foreignObject x="408" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">dbt 01_staging · 02_int</div></foreignObject>
      <text x="408" y="360" class="example-label">EXAMPLES</text>
      <text x="408" y="374" class="example-value">deduped events</text>
      <text x="408" y="388" class="example-value">conformed dimensions</text>

      <!-- Gold -->
      <rect x="580" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="580" y="80" width="172" height="50" fill="rgba(45,49,66,0.06)" clip-path="url(#clip-gold)"/>
      <rect x="580" y="80" width="172" height="380" rx="6" fill="none" stroke="#2d3142"/>
      <text x="666" y="106" class="tier-title">Gold</text>
      <text x="666" y="144" class="bucket">iceberg.gold</text>
      <text x="596" y="180" class="field-label">Tool</text>
      <foreignObject x="596" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">dbt-trino</div></foreignObject>
      <text x="596" y="220" class="field-label">Format</text>
      <foreignObject x="596" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Iceberg · business marts</div></foreignObject>
      <text x="596" y="260" class="field-label">Writer</text>
      <foreignObject x="596" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">dbt 03_marts</div></foreignObject>
      <text x="596" y="360" class="example-label">EXAMPLES</text>
      <text x="596" y="374" class="example-value">campaign summary</text>
      <text x="596" y="388" class="example-value">customer overview</text>

      <!-- ClickHouse serving (focal) -->
      <rect x="768" y="80" width="172" height="380" rx="6" fill="rgba(191,69,32,0.07)"/>
      <rect x="768" y="80" width="172" height="50" fill="rgba(191,69,32,0.14)" clip-path="url(#clip-serve)"/>
      <rect x="768" y="80" width="172" height="380" rx="6" fill="none" stroke="#bf4520" stroke-width="1.6"/>
      <text x="854" y="106" class="tier-title">ClickHouse serving</text>
      <text x="854" y="144" class="bucket focal-text">clickhouse gold.*</text>
      <text x="784" y="180" class="field-label">Tool</text>
      <foreignObject x="784" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">pipeline/serving publish</div></foreignObject>
      <text x="784" y="220" class="field-label">Format</text>
      <foreignObject x="784" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">MergeTree · staging + atomic swap</div></foreignObject>
      <text x="784" y="260" class="field-label">Writer</text>
      <foreignObject x="784" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Airflow publish task</div></foreignObject>
      <text x="784" y="360" class="example-label">CONSUMERS</text>
      <text x="784" y="374" class="example-value focal-text">TMA / CDP dashboards</text>
      <text x="784" y="388" class="example-value focal-text">datalab portal</text>

      <!-- Shared substrate + maintenance -->
      <rect x="16" y="476" width="460" height="56" rx="6" fill="#fff" stroke="rgba(45,49,66,0.20)"/>
      <rect x="24" y="482" width="64" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="56" y="491" class="path-tag" fill="#2d3142" font-size="7" text-anchor="middle">SUBSTRATE</text>
      <text x="96" y="506" class="path-title">RustFS s3://datalake · Hive Metastore · Trino 480</text>
      <text x="96" y="522" class="path-sub">5 hosts :19010 · kr-hadoop01:9083 · NodePort 30080</text>
      <rect x="492" y="476" width="460" height="56" rx="6" fill="#fff" stroke="rgba(45,49,66,0.20)"/>
      <rect x="500" y="482" width="80" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="540" y="491" class="path-tag" fill="#2d3142" font-size="7" text-anchor="middle">MAINTENANCE</text>
      <text x="588" y="506" class="path-title">ops_maintenance_iceberg_daily</text>
      <text x="588" y="522" class="path-sub">optimize · expire_snapshots 7d · remove_orphan_files</text>
    </svg>
    </div>
    <p class="callout">예외 — tma_16은 Iceberg를 거치지 않고 dbt-clickhouse로 ClickHouse 안에서 직접 변환한다.</p>
  </main>
</body>
</html>
